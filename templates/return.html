{% extends 'base.html' %}{% block title %}Return Book{% endblock %}{% block content %}<div class="formbox"><h1>📥 Return Book</h1><form method="post"><label>Loan<select name="isbn" required>{% for l in loans %}<option value="{{ l.isbn }}" data-card="{{ l.card_id }}">{{ books[l.isbn].title }} — {{ readers[l.card_id].name }}</option>{% else %}<option>No active loans</option>{% endfor %}</select></label><input type="hidden" name="card_id" id="card_id"><button type="button" class="btn" onclick="setCardAndSubmit()" {% if not loans %}disabled{% endif %}>Return Book</button></form></div><script>function setCardAndSubmit(){const select=document.querySelector('select[name=isbn]');document.getElementById('card_id').value=select.options[select.selectedIndex].dataset.card;document.querySelector('form').submit()}</script>{% endblock %}
