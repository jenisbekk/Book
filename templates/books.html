{% extends 'base.html' %}{% block title %}Books{% endblock %}{% block content %}<div class="pagehead"><h1>Books</h1><a class="btn" href="{{ url_for('add_book') }}">+ Add book</a></div><form class="search"><input name="q" value="{{ q }}" placeholder="Search title, author or ISBN"><button>Search</button></form><div class="card"><table><tr><th>ISBN</th><th>Title</th><th>Author</th><th>Year</th><th>Availability</th><th></th></tr>{% for b in books %}<tr><td>{{ b.isbn }}</td><td><strong>{{ b.title }}</strong></td><td>{{ b.author }}</td><td>{{ b.year }}</td><td><span class="badge">{{ b.available }}/{{ b.copies }}</span></td><td class="rowactions"><a href="{{ url_for('edit_book',isbn=b.isbn) }}">Edit</a><form method="post" action="{{ url_for('delete_book',isbn=b.isbn) }}"><button class="link danger" onclick="return confirm('Remove this book?')">Delete</button></form></td></tr>{% else %}<tr><td colspan="6" class="muted">No books found.</td></tr>{% endfor %}</table></div>{% endblock %}
