<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Library{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
<header><div class="wrap nav"><a class="brand" href="{{ url_for('index') }}">📚 Library</a><nav><a href="{{ url_for('books') }}">Books</a><a href="{{ url_for('readers') }}">Readers</a><a href="{{ url_for('issue') }}">Issue</a><a href="{{ url_for('return_book') }}">Return</a><a href="{{ url_for('history') }}">History</a><a href="{{ url_for('overdue') }}">Overdue</a></nav></div></header>
<main class="wrap">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
</body></html>
