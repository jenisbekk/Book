{% extends 'base.html' %}{% block title %}Overdue{% endblock %}{% block content %}<div class="pagehead"><h1>⏰ Overdue Books</h1></div><div class="card"><table><tr><th>Book</th><th>Reader</th><th>Issued</th><th>Due</th></tr>{% for l in loans %}<tr><td>{{ books[l.isbn].title }}</td><td>{{ readers[l.card_id].name }}</td><td>{{ l.issued }}</td><td class="danger">{{ l.due }}</td></tr>{% else %}<tr><td colspan="4" class="muted">No overdue books.</td></tr>{% endfor %}</table></div>{% endblock %}
