{% extends 'base.html' %}{% block title %}Readers{% endblock %}{% block content %}<div class="pagehead"><h1>Readers</h1><a class="btn" href="{{ url_for('add_reader') }}">+ Register reader</a></div><div class="card"><table><tr><th>Card ID</th><th>Name</th><th>Contact</th></tr>{% for r in readers %}<tr><td>{{ r.card_id }}</td><td>{{ r.name }}</td><td>{{ r.contact }}</td></tr>{% else %}<tr><td colspan="3" class="muted">No readers registered.</td></tr>{% endfor %}</table></div>{% endblock %}
