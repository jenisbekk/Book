{% extends 'base.html' %}{% block title %}Issue Book{% endblock %}{% block content %}<div class="formbox"><h1>📤 Issue Book</h1><p class="muted">Give a book to a registered reader.</p><form method="post"><label>Book<select name="isbn" required>{% for b in books %}<option value="{{ b.isbn }}">{{ b.title }} — {{ b.author }} ({{ b.available }} available)</option>{% else %}<option>No available books</option>{% endfor %}</select></label><label>Reader<select name="card_id" required>{% for r in readers %}<option value="{{ r.card_id }}">{{ r.name }} — {{ r.card_id }}</option>{% else %}<option>No registered readers</option>{% endfor %}</select></label><button class="btn" {% if not books or not readers %}disabled{% endif %}>Issue Book</button></form></div>{% endblock %}
