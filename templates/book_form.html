{% extends 'base.html' %}{% block title %}{{ 'Edit' if book else 'Add' }} Book{% endblock %}{% block content %}<div class="formbox"><h1>{{ 'Edit' if book else 'Add' }} Book</h1><form method="post"><label>ISBN<input name="isbn" value="{{ book.isbn if book else '' }}" {% if book %}readonly{% endif %} required></label><label>Title<input name="title" value="{{ book.title if book else '' }}" required></label><label>Author<input name="author" value="{{ book.author if book else '' }}" required></label><label>Year<input type="number" name="year" value="{{ book.year if book else '' }}" required></label><label>Copies<input type="number" min="1" name="copies" value="{{ book.copies if book else 1 }}" required></label><button class="btn">Save</button><a href="{{ url_for('books') }}" class="cancel">Cancel</a></form></div>{% endblock %}
